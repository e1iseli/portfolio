}
.contact-btn:hover { transform: translateY(-1px); opacity: 0.9; }
.contact-btn__arrow {
  display: inline-flex; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.contact-btn:hover .contact-btn__arrow { transform: translate(2px, -2px); }

@media (max-width: 760px) {
  .nav-center { display: none; }
  .contact-btn span { display: none; }
  .contact-btn { padding: 0 12px; width: 36px; justify-content: center; }
}

/* ═══ BANNER ═══ */
.banner {
  position: relative; min-height: 100vh;
  display: flex; align-items: center;
  padding: 140px 0 80px; overflow: hidden;
}
.banner__inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; gap: 28px; max-width: 900px;
}
.banner__hero { font-family: Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
.banner__hero-line {
  display: block; opacity: 0; transform: translateY(24px);
  animation: rise 1s cubic-bezier(0.2,0.8,0.2,1) forwards;
  font-size: clamp(40px, 5.5vw, 72px); line-height: 1.15;
}
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
.banner__wave-emoji { display: inline-block; animation: wave 2.6s ease-in-out infinite; transform-origin: 70% 80%; }
@keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(18deg); } 20%,40% { transform: rotate(-12deg); } }

.banner__subs {
  display: flex; flex-direction: column; gap: 6px;
  opacity: 0; animation: rise 1s cubic-bezier(0.2,0.8,0.2,1) 0.2s forwards;
}
.banner__sub-line {
  font-family: var(--font-body);
  font-size: clamp(17px, 1.8vw, 24px);
  font-weight: 300; color: var(--ink-60); line-height: 1.5;
}

/* SCROLL ARROW */
.scroll-arrow {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  z-index: 3; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--hairline-strong);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-60); background: var(--glass-bg);
  backdrop-filter: blur(10px);
  transition: transform 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  opacity: 0; animation: rise 1s ease 0.8s forwards; cursor: pointer;
}
.scroll-arrow:hover { transform: translateX(-50%) translateY(3px); color: var(--ink); border-color: var(--ink-40); }
.scroll-arrow svg { animation: bounce-down 2s ease-in-out infinite; }
@keyframes bounce-down { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

/* PAGE BANNER */
.page-banner {
  position: relative; min-height: 40vh;
  display: flex; align-items: center;
  padding: 140px 0 60px; overflow: hidden;
}
.page-banner__inner { position: relative; z-index: 2; }
.page-banner__title { font-family: Georgia, serif; font-weight: 400; font-size: clamp(48px,8vw,100px); line-height: 1; letter-spacing: -0.02em; }
.page-banner__title em { font-style: italic; color: var(--ink-60); }
.page-banner__sub { font-family: var(--font-body); font-weight: 300; font-size: clamp(16px,1.6vw,22px); color: var(--ink-60); margin-top: 16px; max-width: 540px; }


/* ═══ FEATURED PROJECTS ═══ */
.section-kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 18px;
}
.featured-projects { padding: 92px 0 42px; position: relative; overflow: hidden; }
.featured-projects::before {
  content: ""; position: absolute; left: 50%; top: 8%; width: min(820px, 78vw); height: 360px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(255, 46, 158, 0.14), transparent 62%); filter: blur(34px); pointer-events: none;
}
body.dark .featured-projects::before { background: radial-gradient(circle, rgba(130, 255, 168, 0.12), rgba(255, 46, 158, 0.08) 38%, transparent 68%); }
.featured-projects__head { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.7fr); gap: 28px; align-items: end; margin-bottom: 32px; }
.featured-projects__head h2, .beyond-work__copy h2 { font-family: Georgia, serif; font-size: clamp(34px, 4.4vw, 72px); line-height: 1.02; font-weight: 400; letter-spacing: -0.02em; max-width: 860px; }
.featured-projects__head p, .beyond-work__copy > p { color: var(--ink-60); font-size: clamp(15px, 1.3vw, 18px); line-height: 1.7; font-weight: 300; }
.featured-projects__grid { display: grid; grid-template-columns: 1.25fr 0.88fr 0.88fr; gap: 18px; align-items: stretch; }
.featured-card {
  appearance: none; border: 1px solid var(--hairline); background: var(--bg-soft); color: var(--ink); text-align: left; padding: 0; border-radius: 8px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; min-height: 520px; box-shadow: 0 24px 60px -45px rgba(0,0,0,0.45); transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.45s ease, border-color 0.45s ease;
}
.featured-card:hover { transform: translateY(-6px); border-color: var(--ink-40); box-shadow: 0 34px 80px -44px rgba(0,0,0,0.56); }
.featured-card__media { display: block; position: relative; aspect-ratio: 1.2/1; overflow: hidden; background: #111; }
.featured-card--1 .featured-card__media { aspect-ratio: 1.34/1; }
.featured-card__media img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.01); transition: transform 0.7s cubic-bezier(0.2,0.8,0.2,1), filter 0.45s ease; }
.featured-card:hover .featured-card__media img { transform: scale(1.055); filter: saturate(1.06) contrast(1.02); }
.featured-card__body { display: flex; flex-direction: column; gap: 12px; padding: 24px; flex: 1; }
.featured-card__meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-60); }
.featured-card__title { font-family: Georgia, serif; font-size: clamp(24px, 2.2vw, 36px); line-height: 1; }
.featured-card__brief { color: var(--ink-60); font-size: 14.5px; line-height: 1.55; font-weight: 300; max-width: 520px; }

/* ═══ BEYOND THE WORK ═══ */
.beyond-work { padding: 58px 0 84px; position: relative; overflow: hidden; }
.beyond-work__inner { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(360px, 0.85fr); gap: 44px; align-items: center; }
.beyond-work__copy > p { max-width: 720px; margin-top: 18px; }
.beyond-work__stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 32px; }
.beyond-stat { min-height: 150px; border: 1px solid var(--hairline); border-radius: 8px; padding: 22px; background: color-mix(in srgb, var(--bg-soft) 88%, transparent); }
.beyond-stat span { display: block; font-family: Georgia, serif; font-size: clamp(42px, 5vw, 76px); line-height: 0.95; letter-spacing: -0.03em; }
.beyond-stat p { margin-top: 14px; color: var(--ink-60); font-size: 13.5px; line-height: 1.5; font-weight: 300; }
.speaker-board { position: relative; min-height: 560px; }
.speaker-photo {
  position: absolute; border-radius: 8px; border: 1px solid rgba(255,255,255,0.44); overflow: hidden; box-shadow: 0 28px 70px -42px rgba(0,0,0,0.62);
  background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,46,158,0.2) 42%, rgba(134,255,191,0.22));
}
.speaker-photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.04), rgba(255,255,255,0.24)), repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 18px); }
.speaker-photo span { position: absolute; left: 22px; bottom: 20px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20,20,26,0.58); z-index: 1; }
.speaker-photo--large { width: 72%; height: 68%; left: 10%; top: 7%; transform: rotate(-3deg); }
.speaker-photo--top { width: 42%; height: 34%; right: 0; top: 0; transform: rotate(5deg); background: linear-gradient(135deg, rgba(224,248,255,0.92), rgba(255,46,158,0.18)); }
.speaker-photo--bottom { width: 48%; height: 38%; right: 6%; bottom: 2%; transform: rotate(3deg); background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(154,255,184,0.24), rgba(255,46,158,0.14)); }
body.dark .speaker-photo { border-color: rgba(255,255,255,0.1); background: linear-gradient(135deg, rgba(12,18,18,0.95), rgba(56,255,188,0.2) 46%, rgba(255,46,158,0.16)); }
body.dark .speaker-photo span { color: rgba(255,255,255,0.58); }

@media (max-width: 960px) {
  .featured-projects__head, .beyond-work__inner { grid-template-columns: 1fr; }
  .featured-projects__grid { grid-template-columns: 1fr; }
  .featured-card { min-height: auto; }
  .featured-card__media, .featured-card--1 .featured-card__media { aspect-ratio: 1.42/1; }
  .speaker-board { min-height: 460px; }
}
@media (max-width: 560px) {
  .featured-projects { padding: 72px 0 30px; }
  .beyond-work { padding: 42px 0 60px; }
  .featured-projects__head h2, .beyond-work__copy h2 { font-size: 38px; }
  .featured-card__body { padding: 20px; }
  .beyond-work__stats { grid-template-columns: 1fr; }
  .beyond-stat { min-height: 128px; }
  .speaker-board { min-height: 380px; }
  .speaker-photo--large { width: 76%; height: 62%; left: 2%; }
  .speaker-photo--top { width: 50%; height: 30%; }
  .speaker-photo--bottom { width: 58%; height: 34%; right: 0; }
}

/* ═══ PROJECTS ═══ */
.projects { padding: 80px 0 120px; position: relative; }
.projects__head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 36px; padding-bottom: 18px; border-bottom: 1px solid var(--hairline);
}
.projects__title { font-family: Georgia, serif; font-size: clamp(22px,2.4vw,32px); font-weight: 400; }
.projects__count { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-60); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
@media (min-width: 1080px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 540px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

.tile {
  position: relative; aspect-ratio: 1/1;
  border-radius: var(--radius); overflow: hidden;
  background: var(--bg-soft); border: 1px solid var(--hairline);
  cursor: pointer;
  transition: transform 0.5s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.5s ease;
  opacity: 0; transform: translateY(16px);
}
.tile.in { opacity: 1; transform: translateY(0); transition: transform 0.7s cubic-bezier(0.2,0.8,0.2,1) var(--d,0s), opacity 0.7s ease var(--d,0s); }
.tile:hover { transform: translateY(-4px) !important; box-shadow: 0 24px 50px -20px rgba(0,0,30,0.25); }
body.dark .tile:hover { box-shadow: 0 24px 60px -16px rgba(0,0,0,0.6); }

.tile__media { position: absolute; inset: 0; background: var(--bg-soft); }
.tile__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.2,0.8,0.2,1), filter 0.5s ease; }
.tile__placeholder { width: 100%; height: 100%; }
.tile:hover .tile__media img { transform: scale(1.06); filter: brightness(0.5) saturate(1.1); }

.tile__overlay {
  position: absolute; inset: 0; padding: 22px 20px 18px;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(180deg, transparent 40%, rgba(8,9,18,0.88) 100%);
  opacity: 0; transition: opacity 0.35s ease; color: #FAFAF7;
}
.tile:hover .tile__overlay { opacity: 1; }
.tile__tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; transform: translateY(8px); transition: transform 0.4s ease 0.05s; }
.tile__name { font-family: Georgia, serif; font-size: 18px; font-weight: 400; line-height: 1.15; transform: translateY(8px); transition: transform 0.4s ease 0.1s; }
.tile__brief { font-size: 12.5px; line-height: 1.45; margin-top: 8px; color: rgba(255,255,255,0.78); font-weight: 300; transform: translateY(8px); transition: transform 0.4s ease 0.15s; }
.tile__arrow {
  position: absolute; top: 16px; right: 16px; width: 30px; height: 30px;
  border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; color: white;
  opacity: 0; transform: translate(6px,-6px); transition: opacity 0.35s ease, transform 0.4s ease;
}
.tile:hover .tile__overlay > * { transform: translateY(0); }
.tile:hover .tile__arrow { opacity: 1; transform: translate(0,0); }

.tile__year {
  position: absolute; bottom: 14px; right: 16px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  color: rgba(20,21,26,0.4); background: rgba(255,255,255,0.65);
  padding: 3px 8px; border-radius: 999px; backdrop-filter: blur(10px);
  z-index: 2; transition: opacity 0.3s ease;
}
body.dark .tile__year { color: rgba(232,236,248,0.4); background: rgba(16,20,36,0.6); }
.tile:hover .tile__year { opacity: 0; }

/* ═══ PROJECT DETAIL ═══ */
.project-detail { padding: 100px 0 80px; position: relative; z-index: 2; }
.project-detail__back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 300; color: var(--ink-60); margin-bottom: 32px; transition: color 0.2s; }
.project-detail__back:hover { color: var(--ink); }
.project-detail__hero { margin-bottom: 40px; }
.project-detail__hero-img { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-soft); }
.project-detail__hero-img img { width: 100%; height: 100%; object-fit: cover; }
.project-detail__header { margin-bottom: 48px; }
.project-detail__title { font-family: Georgia, serif; font-size: clamp(32px,4vw,56px); font-weight: 400; letter-spacing: -0.02em; margin-bottom: 12px; }
.project-detail__meta { display: flex; gap: 16px; align-items: center; }
.project-detail__tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-60); }
.project-detail__year { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-40); }
.project-detail__content { max-width: 800px; }
.project-detail__section { margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--hairline); }
.project-detail__section:last-child { border-bottom: none; }
.project-detail__section h3 { font-family: Georgia, serif; font-size: 20px; font-weight: 400; margin-bottom: 14px; }
.project-detail__section p { font-size: 16px; line-height: 1.7; color: var(--ink-80); font-weight: 300; }
.project-detail__section ul { list-style: none; padding: 0; }
.project-detail__section li { font-size: 16px; line-height: 1.7; color: var(--ink-80); font-weight: 300; padding-left: 20px; position: relative; margin-bottom: 8px; }
.project-detail__section li::before { content: ""; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-40); }
.project-detail__grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--hairline); }
@media (max-width: 540px) { .project-detail__grid-2 { grid-template-columns: 1fr; } }
.project-detail__grid-2 .project-detail__section { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.project-detail__stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
@media (max-width: 540px) { .project-detail__stats { grid-template-columns: 1fr; } }
.stat-card { padding: 24px 20px; border-radius: var(--radius); text-align: center; }
.stat-card__num { font-family: Georgia, serif; font-size: 32px; font-weight: 400; margin-bottom: 4px; }
.stat-card__label { font-size: 13px; color: var(--ink-60); font-weight: 300; }

/* ═══ ABOUT ═══ */
.about-intro { padding: 0 0 80px; position: relative; z-index: 2; }
.about-intro__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
@media (max-width: 760px) { .about-intro__grid { grid-template-columns: 1fr; } }
.about-intro__text { font-size: 17px; line-height: 1.75; color: var(--ink-80); font-weight: 300; }
.about-intro__email { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-60); border-bottom: 1px solid var(--hairline); padding-bottom: 2px; transition: color 0.2s; }
.about-intro__email:hover { color: var(--ink); }
.about-intro__photo-placeholder { aspect-ratio: 3/4; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; color: var(--ink-40); font-family: var(--font-mono); font-size: 13px; overflow: hidden; }
.about-intro__photo-placeholder img { width: 100%; height: 100%; object-fit: cover; }

.about-values, .about-community, .about-interests { padding: 40px 0; position: relative; z-index: 2; }
.section-label { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-40); margin-bottom: 24px; }

.values-grid, .community-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
@media (max-width: 760px) { .values-grid, .community-grid { grid-template-columns: 1fr; } }

.value-card { padding: 28px 24px; border-radius: var(--radius); transition: transform 0.3s ease; }
.value-card:hover { transform: translateY(-2px); }
.value-card__icon { font-size: 28px; margin-bottom: 14px; }
.value-card__title { font-family: Georgia, serif; font-size: 18px; font-weight: 400; margin-bottom: 8px; }
.value-card__desc { font-size: 14px; color: var(--ink-60); line-height: 1.5; font-weight: 300; }

.community-card { padding: 28px 24px; border-radius: var(--radius); transition: transform 0.3s ease; }
.community-card:hover { transform: translateY(-2px); }
.community-card__num { font-family: Georgia, serif; font-size: 36px; font-weight: 400; margin-bottom: 8px; }
.community-card h4 { font-family: Georgia, serif; font-size: 16px; font-weight: 400; margin-bottom: 6px; }
.community-card p { font-size: 13px; color: var(--ink-60); line-height: 1.5; font-weight: 300; }

/* INTERACTIVE INTEREST TAGS */
.interests-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
@media (max-width: 760px) { .interests-cols { grid-template-columns: 1fr; gap: 32px; } }
.interest-tags { display: flex; flex-wrap: wrap; gap: 10px; }
.interest-tag {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 999px;
  background: var(--glass-bg); backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  font-size: 14px; color: var(--ink-80); font-weight: 300;
  cursor: pointer; user-select: none;
  transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1), background 0.2s, box-shadow 0.3s, border-color 0.2s;
}
.interest-tag:hover {
  transform: translateY(-3px) scale(1.03);
  background: var(--glass-bg-strong);
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12);
}
body.dark .interest-tag:hover { box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4); }
.interest-tag.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  transform: scale(1.05);
}
.interest-tag__emoji { font-size: 16px; transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1); }
.interest-tag:hover .interest-tag__emoji { transform: scale(1.2) rotate(-8deg); }
.interest-tag.active .interest-tag__emoji { transform: scale(1.15); }

/* CONTACT */
.contact-page { min-height: calc(100vh - 160px); display: flex; align-items: center; padding: 140px 0 80px; }
.contact-page__inner { max-width: 560px; margin: 0 auto; text-align: center; }
.contact-page__title { font-family: Georgia, serif; font-size: clamp(36px,5vw,56px); font-weight: 400; letter-spacing: -0.02em; margin-bottom: 16px; }
.contact-page__sub { font-size: 17px; color: var(--ink-60); font-weight: 300; line-height: 1.6; margin-bottom: 48px; }
.contact-page__links { display: flex; flex-direction: column; gap: 1px; }
.contact-link { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: var(--radius); transition: background 0.2s; text-align: left; }
.contact-link:hover { background: var(--glass-bg); }
.contact-link__icon { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--ink-80); flex-shrink: 0; }
.contact-link__info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.contact-link__label { font-size: 12px; color: var(--ink-40); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
.contact-link__value { font-size: 15px; color: var(--ink-80); font-weight: 300; }

/* ═══ FOOTER ═══ */
.footer { padding: 28px 0 32px; border-top: 1px solid var(--hairline); position: relative; z-index: 2; }
.footer__inner { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.footer__copy { font-family: var(--font-body); font-size: 12px; font-weight: 300; color: var(--ink-40); }
.footer__socials { display: flex; gap: 4px; }
.footer__social { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-60); transition: color 0.2s, transform 0.2s; }
.footer__social:hover { color: var(--ink); transform: translateY(-1px); }
.footer__controls { display: flex; align-items: center; gap: 8px; }
.footer__toggle { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 12px; color: var(--ink-40); transition: background 0.2s, color 0.2s; }
.footer__toggle:hover { background: var(--glass-bg); color: var(--ink-60); }
